name: Refresh ship list

# Rebuilds data/ships.json from the official Pixel Starships API so the website's
# "Find a ship hull" box has every ship. Runs weekly, and on demand from the Actions tab.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ship list
        run: python3 tools/build_ship_list.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898273+github-actions[bot]@users.noreply.github.com"
          git add data/ships.json
          if git diff --cached --quiet; then
            echo "Ship list unchanged."
          else
            git commit -m "Refresh ship list"
            git push
          fi
